<!doctype html>
<html lang="no">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Hundepasser</title>
  <link rel="stylesheet" href="booking.css" />
  <script type="module" src="/src/main.ts" defer></script>
</head>

<body>
  <header id="site-header"></header>

  <main>
    <h1>BOOK HUNDEPASSER</h1>

    <img src="/images/PawPrint_line.png" alt="" class="pawprint-line" aria-hidden="true" />

    <p id="chosen-dogsitter-txt" class="skeleton skeleton-text-line">
      Laster valgt hundepasser
    </p>

    <div class="dog-sitter-card">
      <div class="rating-container">
        <img class="profile-img" src="/images/dog1.png" alt="hundepassers profil bilde" />

        <div class="star-rating skeleton-rating" aria-label="Laster vurdering">
          <div class="stars-empty" aria-hidden="true">★★★★★</div>
          <div class="stars-filled" aria-hidden="true">★★★★★</div>
        </div>
      </div>

      <div>
        <h2 class="dog-sitter-name skeleton skeleton-title">
          Laster navn
        </h2>

        <p class="user-description-txt skeleton skeleton-paragraph">
          Laster beskrivelse
        </p>
      </div>
    </div>

    <p>Velg hund(er) og send forspørselen.</p>

    <form action="">
      <h4 class="form-title">BOOK HUNDEPASSER</h4>

      <div class="form-container">
        <div class="choose-dog-container">
          <label class="form-label">
            <span aria-hidden="true">*</span>VELG HUNDER:
          </label>

          <div class="dogs-container" aria-live="polite">
            <div class="dog-skeleton skeleton"></div>
            <div class="dog-skeleton skeleton"></div>
            <div class="dog-skeleton skeleton"></div>
          </div>
        </div>

        <div class="allergy-info-container hidden">
          <p class="fw-bold block-txt">
            Viktig informasjon om valgt(e) hund(er):
          </p>

          <div class="dog-allergy-container">
            <img src="/images/allergy-checkmark.png" alt="" class="checkmark-img" />

            <div class="dog-allergy-info"></div>
          </div>
        </div>

        <div class="info-container hidden">
          <p class="fw-bold block-txt">Allergiinformasjon</p>

          <div class="dog-allergy-container">
            <img src="/images/allergy-warning.png" alt="" class="warning-img" />

            <p class="fw-semibold block-txt">
              Denne informasjonen sendes til hundepasseren slik at de kan
              vurdere om de kan ta oppdraget.
            </p>
          </div>
        </div>

        <div class="date-container">
          <label class="form-label" for="from-date">
            <span aria-hidden="true">*</span>FRA-DATO:
          </label>

          <input type="date" id="from-date" class="calender form-input" required />

          <label class="form-label" for="to-date">
            <span aria-hidden="true">*</span>TIL-DATO:
          </label>

          <input type="date" id="to-date" class="calender form-input" required />
        </div>

        <div class="message-container">
          <label class="form-label" for="message-input">
            MELDING(VALGFRITT):
          </label>

          <textarea class="form-input" name="message" id="message-input" rows="4" cols="50"
            placeholder="F.eks. rutiner, turvaner, medisiner, hvordan hunden er med andre hunder og mennesker, eller annet hundepasseren bør vite."></textarea>
        </div>

        <div class="btn-container">
          <button type="button" class="btn btn-danger" id="cancel-booking">
            AVBRYT BOOKING
          </button>

          <input type="submit" value="SEND FORESPØRSEL" class="btn btn-success" id="send-booking-btn" />
        </div>
      </div>
    </form>

    <div class="error-msg hidden" role="alert" aria-live="polite">
      <p class="error-msg-txt"></p>
    </div>

    <div class="modal-overlay" id="modal1">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-description" tabindex="-1">
        <div class="modal-body"></div>
      </div>
    </div>

    <div class="booking-sent-container hidden"></div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="/src/Pages/booking/booking.ts"></script>
</body>

</html>
